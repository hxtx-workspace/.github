name: Update organization profile
on:
  workflow_dispatch:
  schedule:
    - cron: '23 1 * * *'
  push:
    branches: [main]
    paths:
      - projects.json
      - scripts/**
      - tests/**
      - .github/workflows/update-profile.yml

permissions:
  contents: write

concurrency:
  group: organization-profile
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12'
      - name: Test public-data boundary
        run: python -m unittest discover -s tests -v
      - name: Generate public profile
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/update_profile.py
      - name: Commit generated files
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add profile/README.md profile/assets/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'docs: refresh public organization dashboard'
          git push
